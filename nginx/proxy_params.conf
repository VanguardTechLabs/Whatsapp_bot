# Cabeceras que necesita la aplicacion para saber quien esta llamando de verdad.
#
# Sin X-Forwarded-For todos los intentos de login llegarian con la IP de nginx,
# y el freno de 8 intentos de server.js bloquearia a todo el mundo a la vez en
# cuanto uno fallara. Sin X-Forwarded-Proto, Express no sabe que la conexion
# venia por HTTPS y se niega a poner la cookie de sesion (`secure: true`).

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection        "";

proxy_connect_timeout 10s;

# Los tiempos de espera de lectura y escritura NO se ponen aqui: cada location
# necesita el suyo (generar tarda mucho mas que cargar una pagina), y una
# directiva repetida en el mismo bloque hace que nginx no arranque.

# Si la aplicacion se esta reiniciando, error claro y rapido en vez de dejar
# la peticion colgada.
proxy_next_upstream error timeout http_502 http_503 http_504;
