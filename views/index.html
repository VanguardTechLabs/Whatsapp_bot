<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Asistente de respuestas</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icono-180.png">
  <meta name="theme-color" content="#0d080f" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#faf6f8" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Asistente">
  <script src="/tema.js"></script>
</head>
<body class="app">

<header>
  <div class="marca">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--a1)"/><stop offset="1" stop-color="var(--a2)"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#g)"/><circle cx="12" cy="13" r="4.6" fill="var(--accent-ink)"/><circle cx="20.5" cy="19.5" r="4.6" fill="var(--accent-ink)" opacity=".55"/></svg>
    <h1>Asistente</h1>
  </div>
  <nav>
    <a href="/estilo">Estilo</a>
    <a href="/instrucciones">Ayuda</a>
    <a href="/ajustes">Ajustes</a>
    <button id="salir" type="button">Salir</button>
  </nav>
</header>

<main class="vista">

  <div class="status">
    <span id="dot" class="dot"></span>
    <span id="estado">Listo.</span>
  </div>

  <div id="error" class="error hidden"></div>

  <div id="banner-demo" class="demo-banner hidden">
    <div class="demo-title">Modo de prueba — estas respuestas no las escribe la IA</div>
    <p id="demo-motivo"></p>
    <p class="demo-warn">Son textos de ejemplo, siempre los mismos. No se los envies a un cliente.</p>
    <a href="/ajustes">Arreglar la clave en Ajustes</a>
  </div>

  <!-- el recuadro para pegar no se va nunca -->
  <section class="bloque-entrada">

    <div class="segmentado" id="modo" role="group" aria-label="Modo" style="margin-bottom:14px">
      <button type="button" data-modo="responder" aria-pressed="true">El ha escrito</button>
      <button type="button" data-modo="escribir" aria-pressed="false">Escribo yo</button>
    </div>

    <div class="fila-rotulo">
      <label class="rotulo" for="mensaje">Que te ha escrito</label>
      <button id="limpiar" class="borrar-x" type="button"
              title="Borrar y empezar de cero" aria-label="Borrar y empezar de cero">✕</button>
    </div>
    <textarea id="mensaje" placeholder="Pega aqui su mensaje."></textarea>

    <div id="fila-idioma" class="row hidden" style="margin-top:12px">
      <span style="font-size:13.5px;color:var(--muted)">Escribirlo en</span>
      <select id="idioma" style="flex:1 1 140px">
        <option value="en">Ingles</option>
        <option value="pt">Portugues</option>
        <option value="es">Espanol</option>
        <option value="fr">Frances</option>
        <option value="it">Italiano</option>
        <option value="de">Aleman</option>
      </select>
    </div>

    <details class="opciones">
      <summary>Opciones</summary>

      <div class="opcion">
        <span class="opcion-nombre">Con quien hablas</span>
        <div class="row">
          <select id="cliente" style="flex:1 1 180px">
            <option value="">Sin cliente</option>
          </select>
          <button id="nuevo-cliente" class="secundario chico" type="button">+ Nuevo</button>
        </div>
        <div id="ficha-cliente" class="ficha hidden"></div>
      </div>

      <div class="opcion">
        <span class="opcion-nombre">Situacion</span>
        <select id="situacion">
          <option value="">Detectar sola</option>
          <option value="saludo">Solo dice hola</option>
          <option value="elogio">Manda un elogio</option>
          <option value="emoji">Manda un emoji</option>
          <option value="conversador">Conversa bastante</option>
          <option value="ausente">Lleva tiempo sin escribir</option>
          <option value="recuperar">Ya compro, hay que recuperarlo</option>
          <option value="mirando">Habla mucho pero no compra</option>
        <option value="concreto">Pregunta algo concreto</option>
        </select>
      </div>

      <div class="opcion">
        <label class="marca-check">
          <input type="checkbox" id="usar-precio">
          <span>Decir el precio en esta respuesta</span>
        </label>
        <input id="precio" class="hidden" type="text" inputmode="decimal"
               placeholder="Por ejemplo: 25 dolares" autocomplete="off">
      </div>

      <div class="opcion">
        <label class="marca-check">
          <input type="checkbox" id="auto" checked>
          <span>Pegado automatico</span>
        </label>
      </div>
    </details>
  </section>

  <!-- resultados -->
  <section id="resultado" class="hidden">
    <div class="dijo">
      <div id="traduccion" class="translation"></div>
      <div id="original" class="original"></div>
      <div class="row" style="margin-top:12px">
        <span id="chip-situacion" class="chip"></span>
        <span id="chip-idioma" class="chip"></span>
      </div>
      <div id="motivo" class="motivo"></div>
    </div>

    <div id="respuestas"></div>
    <div id="meta" class="meta"></div>
  </section>

</main>

<div class="barra">
  <button id="generar" class="primary" type="button">Pegar y generar</button>
  <button id="otra" class="secundario hidden" type="button">Otras respuestas</button>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
